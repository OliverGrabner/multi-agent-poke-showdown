[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokerl"
version = "0.1.0"
description = "LLM teammates in Pokemon Showdown 4-player Multi Battles"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
pokerl = "pokerl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokerl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
